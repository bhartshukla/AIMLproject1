<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>tryAI</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="new-chat-btn" id="newChatBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
          </svg>
          New chat
        </button>
      </div>

      <div class="sidebar-history" id="historyList"></div>

      <div class="sidebar-bottom">
        <div class="brand-tag">
          <span class="brand-dot"></span>
          <div>
            <div class="brand-name">tryAI</div>
            <div class="brand-sub">built by Bharat</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="sidebarToggle" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <line x1="9" y1="4" x2="9" y2="20"/>
          </svg>
        </button>
        <div class="topbar-title">tryAI</div>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </header>

      <div class="chat-scroll" id="chatScroll">
        <div class="empty-state" id="emptyState">
          <div class="empty-mark">tryAI</div>
          <h1>What can I help with?</h1>
          <div class="suggestions" id="suggestions">
            <button class="suggestion-chip" data-prompt="Explain how a hash table works, step by step">Explain how a hash table works</button>
            <button class="suggestion-chip" data-prompt="Write a short professional email asking for a project extension">Draft a project extension email</button>
            <button class="suggestion-chip" data-prompt="Give me 5 ideas for a college mini-project in web development">Ideas for a college mini-project</button>
            <button class="suggestion-chip" data-prompt="Explain the difference between REST and GraphQL in simple terms">REST vs GraphQL, simply</button>
          </div>
        </div>

        <div class="messages" id="messages"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea
            id="promptInput"
            class="composer-input"
            placeholder="Message tryAI..."
            rows="1"
          ></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div class="composer-hint">tryAI can make mistakes. Verify important information.</div>
      </div>
    </main>

  </div>

<script src="script.js"></script>
</body>
</html>
